name: Release and Build Binaries

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  build:
    name: Build on ${{ matrix.os }}
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            executable_name: flip7-advisor
          - os: macos-latest
            os_name: macos
            executable_name: flip7-advisor
          - os: windows-latest
            os_name: windows
            executable_name: flip7-advisor.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with PyInstaller
        shell: bash
        run: |
          SEP=":"
          if [ "$RUNNER_OS" == "Windows" ]; then
            SEP=";"
          fi

          pyinstaller --onefile \
            --name ${{ matrix.executable_name }} \
            --add-data "deck_configs${SEP}deck_configs" \
            main.py

      - name: Rename executable for release
        shell: bash
        run: |
          mv dist/${{ matrix.executable_name }} dist/flip7-advisor-${{ matrix.os_name }}
          if [ "$RUNNER_OS" == "Windows" ]; then
            mv dist/flip7-advisor-${{ matrix.os_name }} dist/flip7-advisor-${{ matrix.os_name }}.exe
          fi

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: dist/flip7-advisor-*